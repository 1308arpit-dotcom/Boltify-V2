<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Create Account</title>

    <link rel="stylesheet"
          href="../css/auth.css">

</head>

<body>

<div class="auth-container">

    <h1>

        Create Account

    </h1>

    <input
        type="text"
        id="name"
        placeholder="Full Name">

    <input
        type="email"
        id="email"
        placeholder="Email Address">

    <input
        type="password"
        id="password"
        placeholder="Password">

    <button id="signupBtn">

        Sign Up

    </button>

    <p>

        Already have an account?

        <a href="login.html">

            Login

        </a>

    </p>

</div>

<script src="../js/signup.js"></script>

</body>

</html>
