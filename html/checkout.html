<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Checkout</title>

    <link rel="stylesheet"
          href="../css/checkout.css">

</head>

<body>
    <header>  <a href="index.html" class="backBtn">

            ← Continue Shopping  🏠</a></header>
    

    <div class="checkout-container">

        <h1>

            Checkout

        </h1>

        <input
            type="text"
            id="customerName"
            placeholder="Full Name">

        <input
            type="text"
            id="phone"
            placeholder="Phone Number">

        <h3>Select Saved Address</h3>

<select id="savedAddresses">

    <option value="">

        Select Address

    </option>

</select>

<p style="text-align:center;margin:10px 0;">
OR
</p>

<textarea
    id="address"
    placeholder="Enter a new delivery address">
</textarea>

        <h3>

            Payment Method

        </h3>

        <label>

            <input
                type="radio"
                name="payment"
                value="Cash on Delivery"
                checked>

            Cash on Delivery

        </label>

        <br><br>

        <label>

            <input
                type="radio"
                name="payment"
                value="UPI">

            UPI

        </label>

        <br><br>

        <label>

            <input
                type="radio"
                name="payment"
                value="Card">

            Debit / Credit Card

        </label>

        <br><br>

        <button id="placeOrderBtn">

            Place Order

        </button>

    </div>

<script src="../js/checkout.js"></script>

</body>

</html>
