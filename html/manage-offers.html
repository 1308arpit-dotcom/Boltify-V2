<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Manage Offers</title>

<link rel="stylesheet" href="../css/manage-Offers.css">

</head>


<body>


<header>

<h1>⚡ Boltify Manage Offers</h1>

</header>



<main>


<section class="offer-form">


<input 
type="text"
id="offerTitle"
placeholder="Coupon Code">


<input 
type="text"
id="offerDescription"
placeholder="Offer Description">


<select id="offerCategory">

<option value="Food">
Food
</option>

<option value="Delivery">
Delivery
</option>

<option value="New User">
New User
</option>

</select>


<input 
type="number"
id="offerDiscount"
placeholder="Discount Amount">


<input 
type="date"
id="offerExpiry">


<button id="addOfferBtn">

Add Offer

</button>


</section>


<div id="adminOffersContainer">


</div>



</main>


<script src="../js/manage-Offers.js"></script>

</body>

</html>
