<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>

Manage Restaurants

</title>

<link rel="stylesheet"
href="../css/manage-restaurants.css">

</head>

<body>

<div class="container">

<h1>

Manage Restaurants

</h1>

<div class="add-form">
<input
type="hidden"
id="restaurantId">


<input
type="text"
id="restaurantName"
placeholder="Restaurant Name">

<input
type="text"
id="restaurantCuisine"
placeholder="Cuisine">

<input
type="number"
id="restaurantRating"
placeholder="Rating">

<input
type="number"
id="restaurantTime"
placeholder="Delivery Time">

<input
type="number"
id="restaurantPrice"
placeholder="Price">

<input
type="text"
id="restaurantDiscount"
placeholder="Discount">

<input
type="text"
id="restaurantImage"
placeholder="Image URL">


<button id="addRestaurantBtn">

Save Restaurant

</button>

</div>

<hr>

<div id="restaurantList">

</div>

</div>

<script src="../js/manage-restaurants.js"></script>

</body>

</html>
