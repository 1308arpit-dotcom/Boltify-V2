<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Your Cart</title>

    <link rel="stylesheet" href="../css/cart.css">

</head>

<body>

    <!-- ==========================
         Navbar
    =========================== -->

    <header class="navbar">

        <h1>🛒 Your Cart</h1>

        <a href="index.html" class="backBtn">

            ← Continue Shopping

        </a>

    </header>

    <!-- ==========================
         Cart Container
    =========================== -->

    <main class="cart-page">

        <div id="cartItems">

            <!-- Cart items will come from JavaScript -->

        </div>

        <div class="bill-box">

            <h2>Bill Details</h2>

            <hr>

            <p>

                Subtotal

                <span id="subtotal">

                    ₹0

                </span>

            </p>

            <p>

                Delivery Fee

                <span>

                    ₹40

                </span>

            </p>

            <p>

                GST (5%)

                <span id="gst">

                    ₹0

                </span>

            </p>
<div class="coupon-box">

    <h3>
        Apply Coupon
    </h3>


    <input 
    type="text"
    id="couponInput"
    placeholder="Enter Coupon Code">


    <button id="applyCouponBtn">

        Apply

    </button>


    <p id="discountText">

    </p>

</div>
            <hr>

            <h2>

                Grand Total

                <span id="grandTotal">

                    ₹0

                </span>

            </h2>

            <button id="checkoutBtn">

                Proceed to Checkout

            </button>

        </div>

    </main>

    <script src="../js/cart.js"></script>

</body>

</html>
